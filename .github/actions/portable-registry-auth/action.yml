name: Portable Artifact Registry authentication
description: Creates a short-lived helper-free registry auth home for containerized and host security tools.

runs:
  using: composite
  steps:
    - name: Write portable registry authentication
      shell: bash
      env:
        REGISTRY_HOST: europe-west1-docker.pkg.dev
      run: |
        set -euo pipefail
        registry_auth_home="$RUNNER_TEMP/registry-auth"
        docker_config_dir="$registry_auth_home/.docker"
        umask 077
        mkdir -p "$docker_config_dir"
        access_token="$(gcloud auth print-access-token)"
        registry_auth="$(printf 'oauth2accesstoken:%s' "$access_token" | base64 | tr -d '\n')"
        unset access_token
        printf '%s\n' "$registry_auth" | jq -Rn --arg registry "$REGISTRY_HOST" '
          input as $auth | {auths: {($registry): {auth: $auth}}}
        ' > "$docker_config_dir/config.json"
        unset registry_auth
        jq -e --arg registry "$REGISTRY_HOST" '
          ((.credsStore // "") == "") and
          (((.credHelpers // {}) | length) == 0) and
          (.auths[$registry].auth | type == "string" and length > 0)
        ' "$docker_config_dir/config.json" >/dev/null
