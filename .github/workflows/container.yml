name: container

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ioterax/shoutrrr:ci-${{ github.sha }}
  DB_CI_IMAGE: ioterax/shoutrrr-postgres:ci-${{ github.sha }}
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0

jobs:
  runtime:
    name: Minimal runtime and vulnerability gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate production Trivy platform contract
        shell: bash
        run: |
          set -euo pipefail
          obsolete_platform_flag='--image''-platform'
          if grep -R -- "$obsolete_platform_flag" .github/workflows; then
            echo 'Production workflows must use the Trivy 0.74.0 --platform flag.' >&2
            exit 1
          fi

          platform_flag_count="$(grep -hF -- '--platform ' \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml | wc -l)"
          test "$platform_flag_count" -eq 5

          docker run --rm "$TRIVY_IMAGE" image --help | grep -F -- '--platform string'

          portable_auth_step_count="$(grep -hF 'name: Create portable registry authentication' \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml | wc -l)"
          test "$portable_auth_step_count" -eq 2

          portable_auth_action_count="$(grep -hF 'uses: ./.github/actions/portable-registry-auth' \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml | wc -l)"
          test "$portable_auth_action_count" -eq 2

          portable_auth_mount_count="$(grep -hF '$RUNNER_TEMP/registry-auth/.docker:/root/.docker:ro' \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml | wc -l)"
          test "$portable_auth_mount_count" -eq 5

          runner_temp_expression='$''{{ runner.temp }}/registry-auth'
          attest_portable_home_count="$(grep -hF "HOME: $runner_temp_expression" \
            .github/workflows/release.yml | wc -l)"
          test "$attest_portable_home_count" -eq 1
          grep -A3 -F \
            'uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373' \
            .github/workflows/release.yml | grep -F "HOME: $runner_temp_expression"

          buildx_setup_count="$(grep -F 'uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c' \
            .github/workflows/release.yml | wc -l)"
          test "$buildx_setup_count" -eq 3

          imagetools_create_count="$(grep -F 'docker buildx imagetools create' \
            .github/workflows/release.yml | wc -l)"
          test "$imagetools_create_count" -eq 2

          grep -F 'docker buildx imagetools inspect "$GAR_IMAGE:$VERSION"' \
            .github/workflows/release.yml
          grep -F -- '--metadata-file "$RUNNER_TEMP/published-manifest.json"' \
            .github/workflows/release.yml
          grep -F 'test "$copied_digest" = "$DIGEST"' \
            .github/workflows/release.yml

          grep -F 'ARG SECURITY_REFRESH=unversioned' Dockerfile
          grep -F "'libcrypto3>=3.5.8-r0'" Dockerfile
          grep -F "'libssl3>=3.5.8-r0'" Dockerfile
          grep -F "'openssl>=3.5.8-r0'" Dockerfile
          grep -F 'ARG SECURITY_REFRESH=unversioned' Dockerfile.postgres
          grep -F "'libcrypto3>=3.5.8-r0'" Dockerfile.postgres
          grep -F "'libssl3>=3.5.8-r0'" Dockerfile.postgres

          release_refresh_expression='SECURITY_REFRESH=release-$''{{ needs.validate.outputs.version }}'
          release_refresh_count="$(grep -F "$release_refresh_expression" \
            .github/workflows/release.yml | wc -l)"
          test "$release_refresh_count" -eq 1

          ci_refresh_expression='SECURITY_REFRESH=ci-$''{{ github.event.pull_request.head.sha || github.sha }}'
          ci_refresh_count="$(grep -F "$ci_refresh_expression" \
            .github/workflows/container.yml | wc -l)"
          test "$ci_refresh_count" -eq 2

          grep -F \
            '"DB_PASSWORD=projects/183905355867/secrets/shoutrrr-database-password:$DB_PASSWORD_VERSION"' \
            .github/workflows/deploy.yml
          if grep -F \
            'DB_PASSWORD=projects/foundation-hub-504212/secrets/shoutrrr-database-password' \
            .github/workflows/deploy.yml; then
            echo 'Cross-project Cloud Run secret references must use the fd-hub numeric project identifier.' >&2
            exit 1
          fi

          grep -F 'suffix="${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"' \
            .github/workflows/deploy.yml
          grep -F 'gcloud run revisions describe "$revision"' \
            .github/workflows/deploy.yml
          grep -F -- '--to-revisions "$previous=100" --quiet' \
            .github/workflows/deploy.yml
          if grep -F 'test "$revision" = "$ready"' .github/workflows/deploy.yml; then
            echo 'Cloud Run readiness must use bounded revision polling instead of an eventually consistent service comparison.' >&2
            exit 1
          fi

          if grep -F 'SKOPEO_IMAGE' .github/workflows/release.yml; then
            echo 'Release publication must not depend on an external Skopeo image.' >&2
            exit 1
          fi

          portable_auth_action=.github/actions/portable-registry-auth/action.yml
          grep -F 'registry_auth_home="$RUNNER_TEMP/registry-auth"' "$portable_auth_action"
          grep -F 'docker_config_dir="$registry_auth_home/.docker"' "$portable_auth_action"
          grep -F 'mkdir -p "$docker_config_dir"' "$portable_auth_action"
          portable_config_reference_count="$(grep -F '"$docker_config_dir/config.json"' \
            "$portable_auth_action" | wc -l)"
          test "$portable_config_reference_count" -eq 2
          grep -F 'access_token="$(gcloud auth print-access-token)"' "$portable_auth_action"
          grep -F 'unset access_token' "$portable_auth_action"
          grep -F '(.credsStore // "") == ""' "$portable_auth_action"
          grep -F '((.credHelpers // {}) | length) == 0' "$portable_auth_action"

          for workflow in .github/workflows/release.yml .github/workflows/deploy.yml; do
            grep -F 'name: Remove portable registry authentication' "$workflow"

            if grep -F '$HOME/.docker:/root/.docker:ro' "$workflow"; then
              echo 'Production scanner containers must not depend on runner credential helpers.' >&2
              exit 1
            fi
            if grep -F '/var/run/docker.sock' "$workflow"; then
              echo 'Production scanner containers must not mount the host Docker socket.' >&2
              exit 1
            fi
          done

      - name: Build the final runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
            SECURITY_REFRESH=ci-${{ github.event.pull_request.head.sha || github.sha }}
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=runtime-amd64
          cache-to: type=gha,scope=runtime-amd64,mode=max
          provenance: false

      - name: Build the Compose PostgreSQL companion
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.postgres
          load: true
          platforms: linux/amd64
          tags: ${{ env.DB_CI_IMAGE }}
          build-args: |
            SECURITY_REFRESH=ci-${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=postgres-amd64
          cache-to: type=gha,scope=postgres-amd64,mode=max
          provenance: false

      - name: Assert runtime contents and size
        shell: bash
        run: |
          set -euo pipefail
          size="$(docker image inspect --format '{{.Size}}' "$CI_IMAGE")"
          test "$size" -le 629145600

          docker run --rm --entrypoint sh "$CI_IMAGE" -ceu '
            test "$(id -u)" = 82
            php -r '\''exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'\''
            php -r '\''exit(extension_loaded("pcntl") && defined("SIGINT") ? 0 : 1);'\''
            php -r '\''exit(extension_loaded("redis") ? 0 : 1);'\''
            test -L public/storage
            test ! -e node_modules
            ! command -v bun
            ! command -v node
            ! command -v npm
            ! command -v yarn
            ! command -v composer
            ! command -v git
          '

          docker run --rm --entrypoint sh "$DB_CI_IMAGE" -ceu '
            test "$(id -u)" = 70
            test ! -e /usr/local/bin/gosu
          '

      - name: Scan the final runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/evidence"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$CI_IMAGE"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --pkg-types os,library \
            --format json \
            --output /evidence/trivy.json \
            "$CI_IMAGE"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output /evidence/sbom.cdx.json \
            "$CI_IMAGE"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /evidence/trivy-postgres.json \
            "$DB_CI_IMAGE"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output /evidence/sbom-postgres.cdx.json \
            "$DB_CI_IMAGE"

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30
