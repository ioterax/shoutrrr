name: shoutrrr

# Self-hosting topology. Every application process uses the same
# immutable iot.EraX image; build tools and node_modules are not present.
x-app-image: &app-image
    image: "${SHOUTRRR_IMAGE:?Set SHOUTRRR_IMAGE to an explicit immutable image reference}"
    pull_policy: "${SHOUTRRR_PULL_POLICY:-always}"
    init: true
    env_file:
        - path: .env
          required: false
    environment: &app-environment
        APP_NAME: "${APP_NAME:-iot.EraX Shout}"
        APP_ENV: "production"
        APP_KEY: "${APP_KEY:?Set APP_KEY to a generated Laravel application key}"
        APP_DEBUG: "false"
        APP_URL: "${APP_URL:-http://localhost:8080}"
        OCTANE_SERVER: "frankenphp"
        OCTANE_HTTPS: "${OCTANE_HTTPS:-false}"
        TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
        INERTIA_SSR_ENABLED: "false"
        DB_CONNECTION: "pgsql"
        DB_HOST: "postgres"
        DB_PORT: "5432"
        DB_DATABASE: "${POSTGRES_DB:-shoutrrr}"
        DB_USERNAME: "${POSTGRES_USER:-shoutrrr}"
        DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
        CACHE_STORE: "database"
        QUEUE_CONNECTION: "database"
        SESSION_DRIVER: "database"
        FILESYSTEM_DISK: "public"
        MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-security@ioterax.com}"
        MAIL_FROM_NAME: "${MAIL_FROM_NAME:-iot.EraX Security}"
    volumes:
        - storage:/var/www/html/storage

services:
    postgres:
        image: "ioterax/shoutrrr-postgres:18.6-local"
        pull_policy: never
        build:
            context: .
            dockerfile: Dockerfile.postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${POSTGRES_DB:-shoutrrr}"
            POSTGRES_USER: "${POSTGRES_USER:-shoutrrr}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    migrate:
        <<: *app-image
        restart: "no"
        command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
        depends_on:
            postgres:
                condition: service_healthy

    app:
        <<: *app-image
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:8080"
        depends_on:
            migrate:
                condition: service_completed_successfully
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    queue:
        <<: *app-image
        restart: unless-stopped
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --timeout=900
            - --memory=352
        depends_on:
            migrate:
                condition: service_completed_successfully
        stop_grace_period: 60s

    scheduler:
        <<: *app-image
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work", "--no-interaction"]
        depends_on:
            migrate:
                condition: service_completed_successfully
        stop_grace_period: 60s

volumes:
    postgres:
    storage:
